<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Agro Rover Control System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load model-viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
    <nav>
        <div class="container nav-content">
            <a href="/" class="logo">AGRO ROVER</a>
            <ul class="nav-links">
                <li><a href="/" id="nav-home">Home</a></li>
                <li><a href="/live" id="nav-live">Live</a></li>
                <li><a href="/dashboard" id="nav-dashboard">Dashboard</a></li>
                <li><a href="/how-it-works" id="nav-how">How It Works</a></li>
                <li><a href="/research" id="nav-research">Research</a></li>
                <li><a href="/impact" id="nav-impact">Impact</a></li>
                <li><a href="/team" id="nav-team">Team</a></li>
            </ul>
            <a href="/team" class="btn btn-outline" style="padding: 0.6rem 1.2rem; font-size: 0.85rem; height: auto;">Get in touch</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="padding: 50px 0; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-secondary); font-size: 0.9rem;">
        <p>&copy; 2026 AI Agro Rover Project. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
